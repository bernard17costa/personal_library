name: Atualizar Biblioteca via ISBN

on:
  push:
    paths:
      - 'livros.json' # Aciona sempre que você alterar o arquivo JSON

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar script de atualização
        run: python atualizar_biblioteca.py

      - name: Salvar alterações no GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-atualiza metadados dos livros via ISBN'
          branch: main
