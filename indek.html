<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca Pessoal</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto bg-white shadow-md rounded-lg p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">📚 Minha Biblioteca Pessoal</h1>
        
        <!-- Caixa de Pesquisa -->
        <div class="mb-4">
            <input type="text" id="searchInput" placeholder="Pesquisar por título, autor ou ISBN..." 
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Tabela de Livros -->
        <div class="overflow-x-auto">
            <table class="w-full table-auto border-collapse">
                <thead>
                    <tr class="bg-blue-600 text-white text-left">
                        <th class="p-3">Capa</th>
                        <th class="p-3">Título</th>
                        <th class="p-3">Autor(es)</th>
                        <th class="p-3">Editora</th>
                        <th class="p-3">Ano</th>
                        <th class="p-3">ISBN</th>
                    </tr>
                </thead>
                <tbody id="tabela-livros" class="divide-y divide-gray-200">
                    <tr>
                        <td colspan="6" class="text-center p-4 text-gray-500">Carregando livros...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Substitua SEU_USUARIO e SEU_REPOSITORIO pelos dados reais do seu GitHub
        const URL_JSON = "https://raw.githubusercontent.com/SEU_USUARIO/SEU_REPOSITORIO/main/livros.json";

        let listaLivros = [];

        async function carregarBiblioteca() {
            try {
                const response = await fetch(URL_JSON);
                if (!response.ok) throw new Error("Erro ao carregar os dados.");
                
                listaLivros = await response.json();
                exibirLivros(listaLivros);
            } catch (error) {
                console.error(error);
                document.getElementById("tabela-livros").innerHTML = `
                    <tr><td colspan="6" class="text-center p-4 text-red-500">Erro ao carregar a base de dados. Verifique o link.</td></tr>
                `;
            }
        }

        function exibirLivros(livros) {
            const tbody = document.getElementById("tabela-livros");
            tbody.innerHTML = "";

            if (livros.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-4 text-gray-500">Nenhum livro encontrado.</td></tr>`;
                return;
            }

            livros.forEach(livro => {
                const tr = document.createElement("tr");
                tr.classList.add("hover:bg-gray-50");

                // Trata a capa (se não tiver imagem, mostra um placeholder)
                const capaHtml = livro.capa 
                    ? `<img src="${livro.capa}" alt="Capa" class="w-12 h-16 object-cover rounded shadow">` 
                    : `<div class="w-12 h-16 bg-gray-200 flex items-center justify-center text-xs text-gray-400 rounded">Sem capa</div>`;

                tr.innerHTML = `
                    <td class="p-3">${capaHtml}</td>
                    <td class="p-3 font-medium text-gray-800">${livro.titulo || "Aguardando atualização..."}</td>
                    <td class="p-3 text-gray-600">${livro.autores || "-"}</td>
                    <td class="p-3 text-gray-600">${livro.editora || "-"}</td>
                    <td class="p-3 text-gray-600">${livro.ano || "-"}</td>
                    <td class="p-3 text-gray-500 font-mono text-sm">${livro.isbn}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Funcionalidade de busca em tempo real
        document.getElementById("searchInput").addEventListener("input", (e) => {
            const termo = e.target.value.toLowerCase();
            const filtrados = listaLivros.filter(livro => 
                (livro.titulo && livro.titulo.toLowerCase().includes(termo)) ||
                (livro.autores && livro.autores.toLowerCase().includes(termo)) ||
                (livro.isbn && livro.isbn.includes(termo))
            );
            exibirLivros(filtrados);
        });

        // Carrega os dados ao abrir a página
        carregarBiblioteca();
    </script>
</body>
</html>
